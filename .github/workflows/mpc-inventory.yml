          assert "std::net" not in source
          assert "Command::new" not in source
          assert "systemctl " not in source
          assert "independent_boot_restore_proven" in source
          assert "watchdog_separate_from_audio" in source
          assert "RestorationUnverified" in source
          print("PASS: no-unsafe pure handoff model, no systemd/device/file API")
          PY
      - name: Validate bounded Rust WAV sampler on synthetic host fixture
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --locked -p mpfree-sampler
          python3 - <<'PY'
          import math, struct, subprocess, wave
          from pathlib import Path
          source=Path("/tmp/mpfree-ci-user-wav.wav")
          with wave.open(str(source),"wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(44100)
              samples=b"".join(struct.pack("<h",round(math.sin(
                  2*math.pi*440*i/44100)*12000)) for i in range(44100))
              w.writeframes(samples)
          result=subprocess.run(
              ["rust/target/release/mpfree-sampler",str(source),
               "/tmp/mpfree-ci-sampler.wav"],
              check=True,capture_output=True,text=True,timeout=30)
          print(result.stdout.strip())
          data=Path("/tmp/mpfree-ci-sampler.wav").read_bytes()
          assert data[:4]==b"RIFF" and data[8:12]==b"WAVE"
          assert struct.unpack_from("<HHIIHH",data,20)==(
              1,2,44100,352800,8,32)
          assert len(data)==44+88200*8 and data[44:]!=bytes(88200*8)
          print("PASS: own generated sample -> stereo S32_LE WAV without MPC device opens")
          PY
