          import re
          import subprocess
          path="rust/target/armv7-unknown-linux-gnueabihf/release/mpfree-device-smoke"
          binary=Path(path)
          assert binary.is_file() and binary.stat().st_size < 2 * 1024 * 1024
          def readelf(*args):
              return subprocess.run(
                  ["arm-linux-gnueabihf-readelf", *args, path],
