name: MPC read-only inventory checks

on:
  pull_request:
    paths:
      - "tools/mpc-one/**"
      - "src/**"
      - "rust/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/mpc-inventory.yml"
  push:
    branches: [main]
    paths:
      - "tools/mpc-one/**"
      - "src/**"
      - "rust/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/mpc-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Shell syntax and static no-write checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n tools/mpc-one/collect-over-ssh.sh
          bash -n tools/mpc-one/offline-akai-updater.sh
          sh -n tools/mpc-one/read-only-inventory.sh
          sh -n tools/mpc-one/read-only-detail.sh
          sh -n tools/mpc-one/read-only-runtime.sh
          sh -n tools/mpc-one/read-only-io.sh
          sh -n tools/mpc-one/read-only-abi.sh
          sh -n tools/mpc-one/read-only-handoff-preflight.sh
          sh -n tools/mpc-one/read-only-process-map.sh
          sh -n tools/mpc-one/read-only-touchscreen.sh
          sh -n tools/mpc-one/read-only-touch-axes-env.sh
          sh -n tools/mpc-one/read-only-rtthreads.sh
          sh -n tools/mpc-one/read-only-capacity.sh
          sh -n tools/mpc-one/read-only-boot-map.sh
          sh -n tools/mpc-one/read-only-backup-preflight.sh
          sh -n tools/mpc-one/read-only-ram-smoke-env.sh
          bash -n tools/mpc-one/lib/neighbor-identity.sh
          bash -n tools/mpc-one/tests/test-neighbor-identity.sh
      - name: Test neighbor MAC extraction against deterministic fixtures
        run: bash tools/mpc-one/tests/test-neighbor-identity.sh
      - name: Test the eMMC backup against a fake MPC under BusyBox (no device)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox
          MPFREE_REQUIRE_BUSYBOX=1 python3 tools/mpc-one/tests/test_host_emmc_backup.py
      - name: Test the offline Akai updater tools against fake backups and images (no device)
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools e2fsprogs file binutils
          MPFREE_REQUIRE_OFFLINE_TOOLS=1 python3 tools/mpc-one/tests/test_offline_akai_updater.py
          python3 tools/mpc-one/tests/test_offline_update_image.py
      - name: Check the remote survey contains no known destructive operations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [
              Path("tools/mpc-one/read-only-inventory.sh"),
              Path("tools/mpc-one/read-only-detail.sh"),
              Path("tools/mpc-one/read-only-runtime.sh"),
              Path("tools/mpc-one/read-only-io.sh"),
              Path("tools/mpc-one/read-only-abi.sh"),
              Path("tools/mpc-one/read-only-handoff-preflight.sh"),
              Path("tools/mpc-one/read-only-process-map.sh"),
              Path("tools/mpc-one/read-only-touchscreen.sh"),
              Path("tools/mpc-one/read-only-touch-axes-env.sh"),
              Path("tools/mpc-one/read-only-rtthreads.sh"),
              Path("tools/mpc-one/read-only-capacity.sh"),
              Path("tools/mpc-one/read-only-boot-map.sh"),
              Path("tools/mpc-one/read-only-backup-preflight.sh"),
              Path("tools/mpc-one/read-only-ram-smoke-env.sh"),
          ]
          prohibited = (
              r"\b(?:mkfs(?:\.\w+)?|flashcp|fw_setenv|reboot|poweroff|shutdown)\b",
              r"\bdd\s+.*\bof\s*=",
              r"\bsystemctl\s+(?:stop|disable|restart|mask)\b",
              r"\bmount\s+-o\s+remount",
              r"\b(?:parted|sfdisk|fdisk)\b",
              r">\s*/dev/(?:mmcblk|sd)",
          )
          for p in paths:
              text = p.read_text()
              # Do not interpret safety comments like "dd without of=" as commands.
              executable_lines = "\n".join(line for line in text.splitlines()
                                           if not line.lstrip().startswith("#"))
              for pattern in prohibited:
                  assert not re.search(pattern, executable_lines), f"Potential mutation in {p}: {pattern}"
          baseline = paths[0].read_text()
          assert "section 'ALSA kernel devices'" in baseline
          assert "section 'Input device enumeration'" in baseline
          assert 'awk "!/^Serial[[:space:]]*:/" /proc/cpuinfo' in baseline, "CPU serial redaction missing"
          assert "section 'Factory MPC application unit'" in baseline
          detail = paths[1].read_text()
          assert 'app_hardware_links' in detail and 'usb_metadata' in detail
          runtime = paths[2].read_text()
          assert 'alsa_active_procfs' in runtime and 'app_threads' in runtime
          assert 'dd if=/usr/bin/MPC bs=64 count=1' in runtime
          assert 'smaps_rollup' not in "\n".join(line for line in runtime.splitlines() if not line.lstrip().startswith("#"))
          assert 'dd if=/usr/bin/MPC bs=64 count=1' in detail
          wrapper = Path("tools/mpc-one/collect-over-ssh.sh").read_text()
          assert '"--runtime")' in wrapper
          assert '"--abi")' in wrapper
          assert '"--handoff-preflight")' in wrapper
          assert '"--process-map")' in wrapper
          assert '"--touchscreen")' in wrapper
          assert '"--boot-map")' in wrapper
          assert '"--backup")' in wrapper
          # The backup must only read on the MPC: fixed remote commands, dd input only.
          import sys
          sys.path.insert(0, "tools/mpc-one")
          import host_emmc_backup as backup
          assert set(backup.PREFLIGHT_COMMANDS.values()) == {"sh -s hash", "sh -s stat"}
          for cmd in backup.STREAM_COMMANDS.values():
              assert re.fullmatch(r"dd if=/dev/mmcblk0(?:boot[01])? bs=1048576", cmd), cmd
          helper_exec = "\n".join(line for line in Path("tools/mpc-one/host_emmc_backup.py").read_text().splitlines()
                                   if not line.lstrip().startswith("#"))
          assert not re.search(r"\bof\s*=", helper_exec), "backup helper must not name a dd output file"
          preflight = Path("tools/mpc-one/read-only-backup-preflight.sh").read_text()
          preflight_exec = [line for line in preflight.splitlines() if not line.lstrip().startswith("#")]
          for line in preflight_exec:
              assert ">" not in line.replace("2>/dev/null", ""), f"backup preflight redirects output: {line}"
              for forbidden in ("mount", "sync", "fsfreeze", "blockdev", "hdparm", "mmc ", "fw_setenv", "tee", "rm ", "mv ", "cp "):
                  assert forbidden not in line, f"backup preflight must stay read-only: {forbidden}"
          bootmap = Path("tools/mpc-one/read-only-boot-map.sh").read_text()
          bootmap_exec = "\n".join(line for line in bootmap.splitlines() if not line.lstrip().startswith("#"))
          for forbidden in ("kexec -l", "kexec -e", "fw_setenv", "mount ", "systemctl start", "rkdeveloptool", "unsquashfs"):
              assert forbidden not in bootmap_exec, f"boot-map must stay read-only: {forbidden}"
          assert "redact" in bootmap and "<REDACTED>" in bootmap, "boot-map identifier redaction missing"
          # az0x BusyBox od lacks -A/-t and tr classes may be unsupported (observed 2026-11-09).
          for unsupported in ("od -A", "od -t", "[:print:]"):
              assert unsupported not in bootmap_exec, f"boot-map uses BusyBox-unsupported syntax: {unsupported}"
          procmap=Path("tools/mpc-one/read-only-process-map.sh").read_text()
          assert 'systemctl show "$unit"' in procmap
          assert 'systemctl list-units --type=service' in procmap
          assert 'readlink "$fd"' in procmap
          assert 'readlink "$proc/exe"' in procmap
          assert '/proc/[0-9]*' in procmap
          assert '/proc/"$pid"/task/[0-9]*' in procmap
          assert '/proc/$pid/environ' not in procmap
          assert '/proc/$pid/cmdline' not in procmap
          touch=Path("tools/mpc-one/read-only-touchscreen.sh").read_text()
          assert '/sys/bus/i2c/devices/4-0026' in touch
          assert '/sys/class/input/event*/device' in touch
          assert '/sys/class/drm/card0-DSI-1' in touch
          assert '/sys/class/graphics/fb0' in touch
          assert '/proc/bus/input/devices' in touch
          assert 'readlink "$fd"' in touch
          assert '/dev/input/event0' not in "\n".join(
              line for line in touch.splitlines()
              if not line.lstrip().startswith("#")
          )
          assert '"--rtthreads")' in wrapper
          assert '"--capacity")' in wrapper
          assert '"--ram-smoke-env")' in wrapper
          assert '"--ram-smoke-check")' in wrapper
          assert '"--ram-smoke")' in wrapper
          assert '"--headless-check")' in wrapper
          assert '"--headless-smoke")' in wrapper
          assert '"--session-check")' in wrapper
          assert '"--session-smoke")' in wrapper
          assert '"--touch-axes-check")' in wrapper
          assert '"--touch-axes")' in wrapper
          assert 'MPFREE_ACCEPT_TOUCH_AXES' in wrapper
          assert 'host_touch_axes.py' in wrapper
          touchcheck=Path("tools/mpc-one/read-only-touch-axes-env.sh").read_text()
          assert 'ILI2117 Touchscreen' in touchcheck
          assert '/sys/bus/i2c/devices/4-0026' in touchcheck
          assert 'ioctl_performed=no' in touchcheck
          assert 'systemctl stop' not in touchcheck
          inspect_host=Path("tools/mpc-one/host_touch_axes.py").read_text()
          assert 'verify_live_board(out)' in inspect_host
          assert 'preflight_elf(' in inspect_host
          assert 'check_remote_environment(env_out)' in inspect_host
          assert 'verify_touch_preflight(touch_out)' in inspect_host
          assert 'MPFREE_TOUCH_STAGE_SHA256_OK' in inspect_host
          assert 'ulimit -t 3' in inspect_host
          assert 'MPFREE_ACCEPT_TOUCH_IOCTL=YES' in inspect_host
          assert 'WATCHDOG = "MPFREE_TOUCH_IOCTL_WATCHDOG_5S_ARMED"' in inspect_host
          assert 'systemctl stop' not in inspect_host
          assert 'os.kill(' not in inspect_host
          assert 'MPFREE_ACCEPT_SESSION_EXEC' in wrapper
          assert '/release/mpfree-session' in wrapper
          assert 'smoke_profile="session"' in wrapper
          assert 'MPFREE_ACCEPT_HEADLESS_EXEC' in wrapper
          assert '--profile "$smoke_profile"' in wrapper
          assert '/release/mpfree-headless' in wrapper
          assert 'smoke_args+=(--execute)' in wrapper
          assert 'MPFREE_ACCEPT_VOLATILE_EXEC' in wrapper
          assert 'read-only-ram-smoke-env.sh' in wrapper
          host = Path("tools/mpc-one/host_ram_smoke.py").read_text()
          assert '--env-script' in host
          assert 'check_remote_environment(env_out)' in host
          assert 'MPC missing required RAM-smoke utilities' in host
          assert 'ulimit -t 3' in host, "kernel CPU-time limit must remain"
          assert 'RUST_WATCHDOG_MARKER' in host, "Rust self-watchdog proof required"
          assert 'shell_scheduler_policy' in host, "normal-priority guard required"
          assert '"headless": {' in host
          assert '"session": {' in host
          assert '"binary": "mpfree-session"' in host
          assert '"pacing": "monotonic"' in host
          assert 'M7 synthetic timing field' in host
          assert 'int(fields["deadline_misses"]) > count' in host
          assert '"binary": "mpfree-headless"' in host
          assert '"backend": "null"' in host
          assert '"sample_rate_hz": "44100"' in host
          assert 'get_profile(a.profile)' in host
          assert 'parse_results(stdout, stderr, code, a.profile)' in host
          headless = Path("rust/mpfree-headless/src/main.rs").read_text()
          assert '#![forbid(unsafe_code)]' in headless
          assert 'mpfree_headless::self_test' in headless
          assert 'MPFREE_HEADLESS_RUST_WATCHDOG_5S_ARMED' in headless
          assert 'std::fs::read_to_string("/proc/self/status")' in headless
          assert not any(s in headless for s in ('/dev/snd', '/dev/dri', '/dev/input', 'systemctl stop', 'std::net::'))
          display_lib=Path("rust/mpfree-display/src/lib.rs").read_text()
          display_main=Path("rust/mpfree-display/src/main.rs").read_text()
          assert '#![forbid(unsafe_code)]' in display_lib
          assert '#![forbid(unsafe_code)]' in display_main
          assert 'render_test_card' in display_lib
          assert 'map_raw_touch' in display_lib
          assert 'QuarterTurn' in display_lib
          assert 'std::fs::OpenOptions' in display_main
          assert '.create_new(true)' in display_main
          for pathtext in (display_lib, display_main):
              assert not any(needle in pathtext for needle in (
                  'systemctl stop', 'systemctl restart', 'std::net::',
                  'std::process::Command', 'EVIOCGRAB', 'ioctl(',
              ))
          touch_lib=Path("rust/mpfree-touch/src/lib.rs").read_text()
          touch_main=Path("rust/mpfree-touch/src/main.rs").read_text()
          assert '#![forbid(unsafe_code)]' in touch_lib
          assert '#![deny(unsafe_op_in_unsafe_fn)]' in touch_main
          assert 'MPFREE_ACCEPT_TOUCH_IOCTL' in touch_main
          assert 'MPFREE_TOUCH_IOCTL_WATCHDOG_5S_ARMED' in touch_main
          assert 'arm_inspection_watchdog()?' in touch_main
          assert 'event_device.components()' in touch_main
          assert '/sys/bus/i2c/devices/4-0026/driver' in touch_main
          assert '/sys/class/input/event0/device/name' in touch_main
          assert '/sys/bus/i2c/devices/4-0026/name' in touch_main
          assert '.read(true)' in touch_main and '.open("/dev/input/event0")' in touch_main
          assert 'fn eviocgabs(' in touch_main
          assert 'fn ioctl(' in touch_main
          assert 'fn read(' not in touch_main
          executable_touch_lines="\n".join(x for x in touch_main.splitlines()
              if not x.lstrip().startswith("//"))
          assert 'EVIOCGRAB,' not in executable_touch_lines
          assert 'std::fs::write(' not in executable_touch_lines
          assert 'std::process::Command' not in touch_main
          assert 'systemctl stop' not in touch_main
          assert '"--touch-abs")' not in wrapper
          for m11 in ("mt", "pointer", "gesture"):
              m11_source = Path(f"rust/mpfree-touch/src/{m11}.rs").read_text()
              assert not any(needle in m11_source for needle in (
                  'std::fs', 'std::os', 'std::net', 'std::process', '/dev/', 'unsafe', 'ioctl',
              )), m11
          session_source=Path("rust/mpfree-session/src/lib.rs").read_text()
          assert '#![forbid(unsafe_code)]' in session_source
          assert 'NullAudioBackend' in session_source
          assert 'std::thread::sleep' in session_source
          assert '/dev/snd' not in session_source and 'std::net' not in session_source
          assert 'backend=null' in Path("rust/mpfree-session/src/main.rs").read_text()
          assert 'MPFREE_SESSION_RUST_WATCHDOG_7S_ARMED' in Path("rust/mpfree-session/src/main.rs").read_text()
          assert 'systemctl' not in session_source
          host_supervisor=Path("tools/mpc-one/host_null_session_supervisor.py").read_text()
          assert 'start_new_session=True' in host_supervisor
          assert 'os.killpg(process.pid' in host_supervisor
          assert 'ssh -T' not in host_supervisor
          assert 'BINARY = REPO_ROOT' in host_supervisor
          rust_smoke = Path("rust/mpfree-device-smoke/src/main.rs").read_text()
          assert "#![forbid(unsafe_code)]" in rust_smoke
          assert 'arm_self_watchdog()' in rust_smoke
          assert 'std::process::abort()' in rust_smoke
          assert 'WALL_WATCHDOG_SECONDS: u64 = 5' in rust_smoke
          assert '"--io")' in wrapper and '"--netbench")' in wrapper
          io = paths[3].read_text()
          assert '/sys/class/net/end0/speed' in io or '"/sys/class/net/end0/$f"' in io
          assert '/sys/class/udc/' in io
          assert 'serial' not in "\n".join(x for x in io.splitlines() if 'usb/devices/' in x)
          bench = Path("tools/mpc-one/network-bench.py").read_text()
          assert 'TRANSFER = 4 * 1024 * 1024' in bench
          print("Static checks passed (not a proof of semantic read-only behavior).")
          PY
      - name: Validate optional network bench without contacting MPC
        run: |
          python3 -m py_compile tools/mpc-one/network-bench.py tools/mpc-one/host_audio_packet.py tools/mpc-one/check-arm-abi.py tools/mpc-one/analyze-capacity.py tools/mpc-one/host_ram_smoke.py tools/mpc-one/host_null_session_supervisor.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate sanitized observed hardware JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/hardware/data/mpc-one-3.6.0-observed.json")
          d = json.loads(p.read_text())
          assert d["provenance"]["hardware_serial_redacted"] is True
          assert d["provenance"]["raw_report_in_repo"] is False
          assert d["board"]["compatible"][-1] == "rockchip,rk3288"
          assert d["cpu"]["logical_cpus"] == 4
          assert d["factory_application"]["service"] == "acvs.service"
          assert len(d["storage"]["partitions"]) == 8
          assert all("serial" not in str(x).lower() for x in d["midi"]["interfaces"])
          print("Redacted device map structure validated (no hardware-access claim).")
          PY
      - name: Verify archived reference USB scripts parse and retain exact source bytes
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          paths = (
              Path("tools/mpc-one/reference-lab/prepare_mpc_one_usb.py"),
              Path("tools/mpc-one/reference-lab/verify_mpc_one_usb.py"),
          )
          for path in paths:
              ast.parse(path.read_text(), filename=str(path))
              print("PASS:", path)
          PY
          test "$(git hash-object tools/mpc-one/reference-lab/prepare_mpc_one_usb.py)" = "45721099d111608d19fe9d49a0aa1f8b06a99fdd"
          test "$(git hash-object tools/mpc-one/reference-lab/verify_mpc_one_usb.py)" = "23d013fc8ca5acaa7ff4a01374cb601bf2d04efe"

  core:
    name: Deterministic core build, tests and offline WAV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run deterministic engine tests and WAV smoke
        run: ctest --test-dir build --output-on-failure
      - name: Validate rendered WAV format and exact size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("build/mpfree-test.wav")
          data = p.read_bytes()
          assert data[:4] == b"RIFF" and data[8:12] == b"WAVE"
          assert data[12:16] == b"fmt " and data[36:40] == b"data"
          fmt = struct.unpack_from("<HHIIHH", data, 20)
          assert fmt == (1, 2, 44100, 44100 * 8, 8, 32), fmt
          data_length = struct.unpack_from("<I", data, 40)[0]
          assert data_length == 44100 * 2 * 4
          assert len(data) == 44 + data_length
          assert any(data[44:]), "Rendered WAV is silent"
          print("Valid 44.1kHz stereo S32_LE 1s offline demo; 0 MPC hardware access")
          PY


  rust:
    name: Rust host parity and ARMv7 hard-float cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with ARMv7 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-unknown-linux-gnueabihf
          rustc --version
          cargo --version
      - name: Test Rust core in native release and debug
        run: |
          cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
          cargo test --manifest-path rust/Cargo.toml --workspace --release --all-targets --locked
          cargo build --manifest-path rust/Cargo.toml --release --locked -p mpfree-render
      - name: Test host-native Rust MPC userspace coexistence self-test
        run: |
          cargo run --manifest-path rust/Cargo.toml --release --locked \
            -p mpfree-device-smoke -- --self-test | tee /tmp/mpfree-smoke-native.txt
          grep -q '^MPFREE_ARMV7_SMOKE_V1$' /tmp/mpfree-smoke-native.txt
          grep -q '^frames=4096$' /tmp/mpfree-smoke-native.txt
          grep -q '^beats=1$' /tmp/mpfree-smoke-native.txt
          grep -q '^status=PASS$' /tmp/mpfree-smoke-native.txt
          # The self-watchdog marker is emitted to stderr at process start.
          # This runs on the CI host, never on the hardware MPC.
          cargo run --manifest-path rust/Cargo.toml --release --locked \
            -p mpfree-device-smoke -- --self-test > /tmp/mpfree-watchdog-native.out 2>/tmp/mpfree-watchdog-native.err
          grep -q '^WATCHDOG=RUST_5S_ARMED$' /tmp/mpfree-watchdog-native.err
          grep -q '^status=PASS$' /tmp/mpfree-watchdog-native.out
      - name: Validate headless groove + sampler + null audio integration
        run: |
          cargo run --manifest-path rust/Cargo.toml --release --locked \
            -p mpfree-headless -- --self-test > /tmp/mpfree-headless.out 2>/tmp/mpfree-headless.err
          grep -q '^MPFREE_HEADLESS_RUST_WATCHDOG_5S_ARMED$' /tmp/mpfree-headless.err
          grep -q '^MPFREE_HEADLESS_V1$' /tmp/mpfree-headless.out
          grep -q '^backend=null$' /tmp/mpfree-headless.out
          grep -q '^frames=88200$' /tmp/mpfree-headless.out
          grep -q '^groove_events=12$' /tmp/mpfree-headless.out
          grep -q '^sampler_notes=4$' /tmp/mpfree-headless.out
          grep -q '^status=PASS$' /tmp/mpfree-headless.out
          grep -Eq '^peak_rss_kib=[0-9]+$' /tmp/mpfree-headless.out
          grep -Eq '^rss_kib=[0-9]+$' /tmp/mpfree-headless.out
          grep -Eq '^elapsed_us=[0-9]+$' /tmp/mpfree-headless.out
          cat /tmp/mpfree-headless.out
      - name: Validate M7 synthetic callback timing and host parent supervisor (NO MPC)
        run: |
          cargo run --manifest-path rust/Cargo.toml --release --locked \
            -p mpfree-session -- --offline-check > /tmp/mpfree-session-offline.out 2>/tmp/mpfree-session-offline.err
          grep -q '^MPFREE_SESSION_V1$' /tmp/mpfree-session-offline.out
          grep -q '^backend=null$' /tmp/mpfree-session-offline.out
          grep -q '^pacing=offline$' /tmp/mpfree-session-offline.out
          grep -q '^callback_count=690$' /tmp/mpfree-session-offline.out
          grep -q '^deadline_misses=0$' /tmp/mpfree-session-offline.out
          grep -q '^checksum_fnv1a64=3dc4d6dabbb17fbd$' /tmp/mpfree-session-offline.out
          grep -q '^status=PASS$' /tmp/mpfree-session-offline.out
          python3 tools/mpc-one/host_null_session_supervisor.py > /tmp/mpfree-session-supervised.out
          grep -q '^MPFREE_M7_HOST_PARENT_SUPERVISOR_V1$' /tmp/mpfree-session-supervised.out
          grep -q '^hardware_access=none$' /tmp/mpfree-session-supervised.out
          grep -q '^callback_count=690$' /tmp/mpfree-session-supervised.out
          grep -q '^status=PASS$' /tmp/mpfree-session-supervised.out
          cat /tmp/mpfree-session-supervised.out
      - name: Validate offscreen GUI card geometry and native panel rotation (NO MPC)
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --locked -p mpfree-display
          display=rust/target/release/mpfree-display
          "$display" --self-test > /tmp/mpfree-display-self-test.txt
          grep -q '^MPFREE_OFFSCREEN_TEST_CARD_V1$' /tmp/mpfree-display-self-test.txt
          grep -q '^hardware_access=none$' /tmp/mpfree-display-self-test.txt
          grep -q '^width=1280$' /tmp/mpfree-display-self-test.txt
          grep -q '^height=800$' /tmp/mpfree-display-self-test.txt
          grep -q '^status=PASS$' /tmp/mpfree-display-self-test.txt
          "$display" --preview-logical /tmp/mpfree-display-logical.ppm
