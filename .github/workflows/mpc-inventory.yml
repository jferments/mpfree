                     for i in range(0, len(pcm), 8)), "Stereo channels differ"
          print("PASS: 2 bars, 24 drum events, 44.1kHz stereo S32_LE, nonzero audio")
          PY
      - name: Prove Rust fake-handoff state machine has no OS side effects
        run: |
          python3 - <<'PY'
