          assert struct.unpack_from("<I", data, 4)[0] == len(data) - 8
          pcm = memoryview(data)[44:]
          assert any(pcm), "Offline drum pattern is silent"
          assert all(pcm[i:i+4] == pcm[i+4:i+8]
                     for i in range(0, len(pcm), 8)), "Stereo channels differ"
          print("PASS: 2 bars, 24 drum events, 44.1kHz stereo S32_LE, nonzero audio")
