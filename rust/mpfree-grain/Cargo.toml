[package]
name = "mpfree-grain"
version = "0.1.0"
edition = "2021"
publish = false
description = "The MPFree grain engine: granular playback of a region and granular effects on a live buffer, real-time safe"

[dependencies]
mpfree-node = { path = "../mpfree-node" }
# The 8-point read and the windowed-sinc kernel, shared with the sampler
# and the streaming cursors (grains read clean, DSP quality).
mpfree-stream = { path = "../mpfree-stream" }
