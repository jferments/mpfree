[package]
name = "mpfree-fxlab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline measurement of MPFree's effects (and of captured reference effects): aliasing, distortion, noise, response, nulls, loudness, reverb decay and density, dynamics timing and zipper noise, as report cards"

[dependencies]
mpfree-node = { path = "../mpfree-node" }
mpfree-fx = { path = "../mpfree-fx" }
mpfree-grain = { path = "../mpfree-grain" }
mpfree-instruments = { path = "../mpfree-instruments" }
mpfree-sampler = { path = "../mpfree-sampler" }
mpfree-sampler-ui = { path = "../mpfree-sampler-ui" }
# The streaming cursor and the stretch, measured as pitched reads
# (readers.rs); the testkit plays a file as a stem plays.
mpfree-stream = { path = "../mpfree-stream", features = ["testkit"] }
mpfree-stretch = { path = "../mpfree-stretch" }
# An audio track's region following the tempo, measured as a pitched read
# (readers.rs, the audio tracks rethink's phase 5a).
mpfree-audiotracks = { path = "../mpfree-audiotracks" }
mpfree-transport = { path = "../mpfree-transport" }
mpfree-synth = { path = "../mpfree-synth" }
mpfree-synth-ui = { path = "../mpfree-synth-ui" }
# A keygroup in a tuning, for the pad filter's key tracking (PF9).
mpfree-tuning = { path = "../mpfree-tuning" }
