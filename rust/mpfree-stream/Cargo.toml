[package]
name = "mpfree-stream"
version = "0.1.0"
edition = "2021"
publish = false
description = "The shared stream layer: long sounds played from disk through a RAM cache the sound thread owns, read in their own format, every request tagged with who asked; no allocation, locking or file access on the sound thread"

[lib]
name = "mpfree_stream"
path = "src/lib.rs"

[dependencies]
# Content hashes for prepared copies and snapshots; already in the
# workspace (mpfree-stick, mpfree-factory).
sha2 = "0.10"
# FLAC decoded a frame at a time, for FLAC sources (our own decoder).
mpfree-flac = { path = "../mpfree-flac" }
# The Storage kinds a watch reports (std only, no I/O).
mpfree-status = { path = "../mpfree-status" }

# O_DIRECT for checking a published file past the page cache (a constant
# only: the crate has no unsafe code).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Marked sounds and the frame checker, for tests built on the layer.
testkit = []

[dev-dependencies]
mpfree-stream = { path = ".", features = ["testkit"] }
