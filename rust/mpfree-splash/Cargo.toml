[package]
name = "mpfree-splash"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "mpfree_splash"
path = "src/lib.rs"

[[bin]]
name = "mpfree-splash"
path = "src/main.rs"

[dependencies]
fontdue = { version = "0.9", default-features = false, features = ["std"] }
libc = "0.2"
mpfree-controller = { path = "../mpfree-controller" }
mpfree-screen-log = { path = "../mpfree-screen-log" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
