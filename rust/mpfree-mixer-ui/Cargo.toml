[package]
name = "mpfree-mixer-ui"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "The mixer screen for the MPC One (Track Mix and Pad Mix): channel strips with faders, meters, pan, mute, solo, sends, inserts and outputs, built on mpfree-ui over mpfree-fx's mixer"

[dependencies]
mpfree-fx = { path = "../mpfree-fx" }
mpfree-ui = { path = "../mpfree-ui" }

[[bin]]
name = "mpfree-mixer-preview"
path = "src/bin/preview.rs"
