[workspace]
members = ["mpfree-core", "mpfree-render", "mpfree-groove", "mpfree-network", "mpfree-sampler", "mpfree-handoff-model", "mpfree-display", "mpfree-touch", "mpfree-touch-evdev", "mpfree-device-smoke", "mpfree-headless", "mpfree-session", "mpfree-controller", "mpfree-arp", "mpfree-screen-log", "mpfree-analysis", "mpfree-transport", "mpfree-seq", "mpfree-play", "mpfree-grain", "mpfree-ui", "mpfree-hello", "mpfree-arp-ui", "mpfree-node", "mpfree-synth", "mpfree-synth-ui", "mpfree-midi-clock", "mpfree-scale"]
