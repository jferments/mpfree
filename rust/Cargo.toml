[workspace]
members = ["mpfree-core", "mpfree-render", "mpfree-groove", "mpfree-network", "mpfree-sampler", "mpfree-handoff-model", "mpfree-display", "mpfree-touch", "mpfree-device-smoke", "mpfree-headless", "mpfree-session", "mpfree-controller"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
