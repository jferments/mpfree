[package]
name = "mpfree-splash-gl"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Not part of the main workspace: SDL3 is built from source here, which the
# workspace's plain ARM cross-build in CI should not have to do.
[workspace]

[[bin]]
name = "mpfree-splash-gl"
path = "src/main.rs"

[dependencies]
mpfree-splash = { path = "../mpfree-splash" }
sdl3 = { version = "0.22.1", features = ["build-from-source-static"] }
glow = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
