[package]
name = "mpfree-sampler"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded Rust WAV sampler with zero-alloc render and note-off fades"

[dependencies]
mpfree-core = { path = "../mpfree-core" }
mpfree-analysis = { path = "../mpfree-analysis" }
mpfree-grain = { path = "../mpfree-grain" }
mpfree-stretch = { path = "../mpfree-stretch" }
mpfree-prof = { path = "../mpfree-prof" }
mpfree-node = { path = "../mpfree-node" }

[dev-dependencies]
mpfree-synth = { path = "../mpfree-synth" }

[[bin]]
name = "mpfree-sampler"
path = "src/main.rs"

[[bin]]
name = "mpfree-chop"
path = "src/bin/chop.rs"

[[bin]]
name = "mpfree-grain"
path = "src/bin/grain.rs"

[[bin]]
name = "mpfree-stretch"
path = "src/bin/stretch.rs"
