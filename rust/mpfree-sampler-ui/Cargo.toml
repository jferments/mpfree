[package]
name = "mpfree-sampler-ui"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "The sampler's screens for the MPC One: the pad editor's Wave tab (waveform, markers, region settings, Q-Links), Chop tab (slices put on pads) and Play tab (velocity layers, envelope, filter, pad settings), built on mpfree-ui"

[dependencies]
mpfree-analysis = { path = "../mpfree-analysis" }
mpfree-sampler = { path = "../mpfree-sampler" }
mpfree-ui = { path = "../mpfree-ui" }

[[bin]]
name = "mpfree-sampler-preview"
path = "src/bin/preview.rs"
