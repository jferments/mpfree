[package]
name = "mpfree-app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "mpfree"
path = "src/main.rs"

[dependencies]
mpfree-core = { path = "../mpfree-core" }
mpfree-controller = { path = "../mpfree-controller" }
mpfree-arp = { path = "../mpfree-arp" }
mpfree-arp-ui = { path = "../mpfree-arp-ui" }
mpfree-screen-log = { path = "../mpfree-screen-log" }
mpfree-touch = { path = "../mpfree-touch" }
mpfree-touch-evdev = { path = "../mpfree-touch-evdev" }
mpfree-ui = { path = "../mpfree-ui" }
mpfree-sampler = { path = "../mpfree-sampler" }
mpfree-transport = { path = "../mpfree-transport" }
mpfree-seq = { path = "../mpfree-seq" }
mpfree-play = { path = "../mpfree-play" }
mpfree-time-ui = { path = "../mpfree-time-ui" }
mpfree-capture = { path = "../mpfree-capture" }
mpfree-perform = { path = "../mpfree-perform" }
mpfree-node = { path = "../mpfree-node" }
mpfree-synth = { path = "../mpfree-synth" }
mpfree-tuning = { path = "../mpfree-tuning" }
mpfree-synth-ui = { path = "../mpfree-synth-ui" }
mpfree-instruments = { path = "../mpfree-instruments" }
mpfree-sampler-ui = { path = "../mpfree-sampler-ui" }
mpfree-looper = { path = "../mpfree-looper" }
# Audio tracks on the Song view (audiotracks.rs).
mpfree-audiotracks = { path = "../mpfree-audiotracks" }
mpfree-store = { path = "../mpfree-store" }
# The mixer (every sound is summed in it) and its screen.
mpfree-fx = { path = "../mpfree-fx" }
mpfree-mixer-ui = { path = "../mpfree-mixer-ui" }
mpfree-mod = { path = "../mpfree-mod" }
# The chain editor and the macros panel (modpanels.rs), and the effects they add.
mpfree-chain-ui = { path = "../mpfree-chain-ui" }
mpfree-fx-ui = { path = "../mpfree-fx-ui" }
# Profiling (block timing, /proc process table). Not its counting-alloc feature.
mpfree-prof = { path = "../mpfree-prof" }
# Pinning the audio thread to a core (`--sound-cores`, cores.rs); the lanes
# themselves live in the sampler and the mixer.
mpfree-lanes = { path = "../mpfree-lanes" }
# MIDI in from the 5-pin jack and USB keyboards (midi_in.rs): the router
# that pairs note-offs with note-ons and the port table.
mpfree-midi = { path = "../mpfree-midi" }
mpfree-midi-clock = { path = "../mpfree-midi-clock" }
mpfree-midi-ui = { path = "../mpfree-midi-ui" }
# The library in the data folder and its browser (the Pads tab's Browse
# view): places, folders, Load, Load to pad and the preview.
mpfree-library = { path = "../mpfree-library" }
mpfree-browser-ui = { path = "../mpfree-browser-ui" }
