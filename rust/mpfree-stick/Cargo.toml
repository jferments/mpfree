[package]
name = "mpfree-stick"
version = "0.1.0"
edition = "2021"
publish = false
description = "The MPFree USB creator's core: an MPFree boot stick from the owner's own Akai update file"

[[bin]]
name = "mpfree-stick"
path = "src/main.rs"

[dependencies]
mpfree-diskimage = { path = "../mpfree-diskimage" }
# MPFree's own drum kits, rendered from the Drums synth, for partition 3.
mpfree-factory = { path = "../mpfree-factory" }
# Akai's update carries the root filesystem xz-compressed; pure Rust, so the
# creator builds on Linux, macOS and Windows alike.
lzma-rs = "0.3"
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
# The setup partition (FAT32) that Akai's script runner reads.
fatfs = "0.3"
# Developer SSH (off by default): the stick's own host key.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "getrandom"] }

[target.'cfg(target_os = "linux")'.dependencies]
# O_EXCL, so a stick still in use is never written.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Locking and dismounting the stick's volumes before writing it.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
