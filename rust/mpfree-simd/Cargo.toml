[package]
name = "mpfree-simd"
version = "0.1.0"
edition = "2021"
publish = false
description = "NEON kernels for the MPC One's ARMv7 cores, in assembly, each with a plain Rust twin that is its reference; the only unsafe code the synths call"

# getauxval, to ask Linux whether the processor has NEON: only where the
# kernels are built.
[target.'cfg(all(target_arch = "arm", target_endian = "little", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
mpfree-lanes = { path = "../mpfree-lanes" }
