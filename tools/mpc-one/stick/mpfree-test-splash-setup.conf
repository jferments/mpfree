[Service]
# The USB creator's sticks: the startup screen (mpfree-startup) stays up while the first-start format step
# makes the stick's data partition, with a card saying so and how far it is. setup-format.sh writes the
# status; mpfree-startup only reads it, and ends when the step is done or had nothing to do.
Environment=MPFREE_SETUP_STATUS=/run/mpfree-setup/format-status
TimeoutStartSec=360
